# Builds the setup program (installer/, tfa-setup.exe) on GitHub's Windows machines whenever it
# changes on main, and publishes it as a release of its own (installer/publish_release.ps1: tag
# setup-v<VERSION>, marked latest). The README's download button points at
# releases/latest/download/tfa-setup.exe. Every build is a NEW release, never a re-upload over an
# older one: replacing an asset resets its download count, and the downloads badge adds up all of
# them. The exe holds no game code or data: it runs setup.ps1 on the player's PC with their own disc.
name: Setup program

on:
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/setup-exe.yml", "VERSION", "recomplauncher.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup-exe
  cancel-in-progress: false

jobs:
  linux:
    # (TODO 31 / home PR #40) The Linux tfa-setup, built on Ubuntu 22.04 (glibc 2.35: runs on SteamOS 3.5+, Bazzite,
    # Fedora, Arch, newer Ubuntu). A failure here never stops the Windows release: it is published without it.
    if: github.repository == 'kayliox/transformers-armada-recomp'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the window (X11 / Wayland / OpenGL headers)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev
      - name: Test
        run: cargo test --release --locked --manifest-path installer/Cargo.toml
      - name: Build tfa-setup (installer/build.sh)
        run: bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tfa-setup-linux
          path: installer/target/release/tfa-setup
  build:
    needs: linux
    if: always() && github.repository == 'kayliox/transformers-armada-recomp'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test setup and launcher entry points
        shell: pwsh
        run: cargo test --locked --manifest-path installer/Cargo.toml
      - name: "Build tfa-setup.exe (no build-machine paths in it, deterministic: installer/build.ps1)"
        shell: pwsh
        run: ./installer/build.ps1
      - name: The Linux tfa-setup, when it was built
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tfa-setup-linux
          path: linux-setup
      - name: Publish it as a release of its own
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./installer/publish_release.ps1 -Exe installer/target/release/tfa-setup.exe -LinuxExe linux-setup/tfa-setup -Commit $env:GITHUB_SHA
      - name: Announce the new version on Discord
        # Only a new version's first release (setup-v<VERSION>), never a rebuild (setup-v<VERSION>-2 ...), and only
        # when the DISCORD_WEBHOOK secret is set (forks and test repos skip it). A failed post never fails the release.
        if: steps.publish.outputs.published != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ steps.publish.outputs.published }}
        shell: pwsh
        run: ./installer/post_discord.ps1 -Tag $env:RELEASE_TAG
