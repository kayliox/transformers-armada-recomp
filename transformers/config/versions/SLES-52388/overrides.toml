# Hand-maintained recompiler settings for Transformers (PAL, SLES-52388).
# The [general] settings are the USA release's (config/overrides.toml), kept in step with it. The two stubs
# below are at the same addresses in SLES_523.88 (an independent PAL function map names them there too).
# Instruction patches: only those whose PAL address has been checked (none yet).
# make_config.py merges these over the generated analyzer/function-finder data.

[general]
# 0 = use (cores - 1) workers when writing the generated C++.
output_worker_threads = 0

# Faster generated code (PS2Recomp register_cache.cpp): the guest's general registers kept in C++
# locals the compiler can hold in host registers; a write also goes through to the context, so it
# is current for anything that looks at it (calls, syscalls, returns).
register_cache = true
# An indirect call (jalr) whose target is not known needs a way back in only after the call, not
# at every instruction of the function (the second keeps the locals from staying in registers).
indirect_call_resume_only = true
# ctx->pc and the delay slot's state stored only before what can read them (runtime calls,
# exceptions), not before every instruction: transfers store their own targets. On since FPS
# round 3 (2026-11-01): the game thread ~4% faster. The "3 of 8 runs" of 2026-10-04 (the
# minicon fight went another way) were with VIF1 on its own thread, where a faster EE can change
# where the threads meet; with VIF1 on the EE thread every run is the same as without it (the
# scripted cold boot into Amazon and the fight route, 8,000-19,000 game ticks, on both workers
# and here). PS2X_CODEGEN_FULL_STORES=1 at build time: off (make_config.py).
minimal_pc_stores = true
# A register written to its local only and stored back before a call, a jump to another
# function, a syscall or a return (register_cache.cpp's write-back). Off: measured slower (~3% a
# frame; ~29% when a label took every register the function writes): MSVC already drops most of
# the write-through stores, and the deferred ones keep the locals live across the function.
register_write_back = false
# A jal to a function of the table: runtime->dispatchGuestCall with the target's table entry
# read in place (PS2_CALL_TARGET) instead of the dispatcher's lookup; the entry is what the lookup
# returns, a replaced function's replacement too. Measured about even with round 2's lookup table
# (82.6 / 82.7 fps); kept on. PS2X_DIRECT_CALLS=0 at run time: the lookup (one call more).
direct_calls = true
# With direct_calls: the call itself made at the jal's site (Ps2CallKnown) instead of in
# dispatchGuestCall. Off. Round 3 measured it ~2% slower with callBegin/callEnd out of line; round 4
# (2026-11-02) made its begin and end inline (PS2Runtime::leafBegin/leafEnd, runtime/ps2_leaf_call.h) and
# measured it ~1-2% slower still (test PC 89.3 vs 90.5 fps with it switched off at run time, the other
# PC 114.0 vs 116.2): ~60 instructions at each of ~60,000 call sites cost more in code size than the
# dispatcher's one indirect call. PS2X_DIRECT_CALLS=1 at run time: dispatchGuestCall.
direct_call_sites = false
# (FPS round 4) A `jal` to a leaf function (no call, no jump out, no loop, no syscall, ends in `jr $ra`) of at
# most this many instructions made with the leaf's code at the site (Ps2CallLeaf_<name>: the call's checkpoint
# and level, the body, the call's end). 0 = off. Measured SLOWER at every size tried: 128 instructions -3.5%
# (test PC), 16 instructions -1.4% (test PC) / -0.8% (other PC) - the code grows (+20-50% of the generated
# code) more than the calls saved. PS2X_INLINE_LEAVES=0 at run time: dispatchGuestCall.
inline_leaves = 0
# (FPS round 4) A loop's checkpoint (each back edge) inline (PS2Runtime::eeLoopCheckpoint) instead of the
# out-of-line eeCheckpointDue. Off: measured even (89.3 / 89.5 fps test PC, 114.0 / 115.9 other PC) for
# more code. PS2X_INLINE_CHECKPOINT=0 at run time: the out-of-line one.
inline_loop_checkpoints = false
# (FPS round 4) A `jalr` made at its site (Ps2CallIndirect: the target's table entry read in place, the call
# there) instead of dispatchGuestBranch. Off: measured even (89.3 / 89.4 fps). PS2X_INDIRECT_CALLS=0 at run
# time: dispatchGuestBranch.
indirect_call_sites = false
# (FPS round 4) A load/store at a constant scratchpad address (what the analysis marks MMIO: aligned, inside its
# 16 KB) made in place (PS2_SPR_LOADn/STOREn) instead of a call to PS2Runtime::Load*/Store* - in Amazon ~5.9
# million such calls a second, all to the scratchpad (the "I/O through the slow path" of rounds 2-3). On: the
# game thread ~1.5-2.7% faster. PS2X_SCRATCHPAD_CONST=0 at run time: the calls.
inline_scratchpad_constants = true
# (FPS round 5) VU0's macro-mode registers (COP2: vu0_vf[n], vu0_acc) in SIMD locals as well (register_cache.cpp),
# written through to the context like the FPU's, loaded again after a call (a VU0 micro program changes them).
# Measured: test PC +3.5%, the other PC +0.5% (the VU0 matrix/vector routines are among the hottest functions).
vu0_register_cache = true
# (FPS round 5) A VU0 instruction's constant destination-field blend (_mm_blendv_ps with a fixed mask - MSVC does
# not fold it) as _mm_blend_ps, or no blend when every field is written; PS2_VADD/PS2_VSUB of a PS2_VMUL result
# without clamping it twice. The same bits.
# Measured about even (other PC +0.4%, test PC -1.4%: build-layout noise); kept - fewer instructions, same bits.
vu0_fold_blends = true
# (FPS round 5) An FPU ADD/SUB/MUL operand that is clamped already (the result of another ADD/SUB/MUL/DIV/SQRT, the
# ACC, a copy of such) not clamped again (register_cache.cpp elideFpuClamps; the clamp is idempotent: the same bits).
# Measured against the final build without it (3 runs each): test PC +0.5%, the other PC +1.3%.
fpu_clamp_elision = true
# (FPS round 5) With minimal_pc_stores: ctx->pc not stored before a forward jump inside a function (nothing at the
# label reads it first - except a branch whose delay slot is also a target, which keeps it). Backward jumps keep it
# for their loop checkpoint.
# Measured: the other PC +0.9%, test PC within noise.
minimal_goto_pc_stores = true
# (FPS round 5) With direct_calls: a jal's table entry read without the bounds test (PS2_CALL_TARGET_IN) - its known
# target is a function of the table, which spans every function.
# Measured: the other PC +0.9%, test PC +0.5%. (This game: 95,638 sites, all inside the table on a filled slot.)
direct_calls_unchecked = true
# These only for these functions (start addresses), to try them on a few; empty: every function.
fast_codegen_only = []

# Extra runtime bindings, e.g. "sceCdRead@0x00123456" or "ret0@0x00123456".
stubs = [
  # iopheap library functions the SDK signature scan did not name. Without
  # these the game's own versions send an RPC nothing answers and the IOP
  # buffers used to load modules are never freed.
  "sceSifFreeSysMemory@0x00126760",
  "sceSifFreeIopHeap@0x001267D8",
]

# Analyzer stub matches to drop (by name) if they turn out to be wrong.
remove_stubs = [
  # Sony's packet builders only move pointers and write tags in memory. The game runs
  # most of that library as its own code (sceVif1PkCnt and friends were not matched), and
  # the runtime's HLE versions of these four keep their own idea of the packet state:
  # the FMV's REGLIST triangles got DMA tags of twice their size, so the chain ran into
  # vertex data and the VIF1 end-of-list interrupt never found its marker.
  "sceGifPkCloseGifTag",
  "sceVif1PkOpenDirectCode",
  "sceVif1PkCloseGifTag",
  "chaGifPkOpenGifTag2",
  # The warp gate's loading screen (0x26F470) sets up the SDK's double buffers in frame mode,
  # 640 x 224 (sceGsSetDefDBuff, its only caller), with clears (sceGsSetDefClear) and the depth
  # buffer behind both (sceGszbufaddr). The HLE versions put both buffers at page 0 shown 224
  # lines high at DY 32, filled no clear (the screen's top circuit kept the last frame) and read
  # sceGszbufaddr's arguments from other registers. The game's own code fills them in as the
  # console does (the display envelopes still by the HLE sceGsSetDefDispEnv, made like the SDK's).
  "sceGsSetDefDBuff",
  "sceGsSetDefClear",
  "sceGszbufaddr",
]

# Extra addresses that must get an exact callable entry.
entry_points = []

skip = []

[patches]
# { address = "0x...", value = "0x..." } raw instruction replacements, PAL addresses.
instructions = [
]
